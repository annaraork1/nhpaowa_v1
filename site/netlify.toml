# Documentation site. Deploy as a separate Netlify site with Base directory = "site".
# The repository-root netlify.toml deploys the web app, not these docs.

[build]
  command = "npm install --no-workspaces && npm run docs:build"
  publish = ".vitepress/dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
